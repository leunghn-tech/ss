<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>M.E.T.S. 股票交易檢討系統</title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js">
  </script>
  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 16px); }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang HK", "Helvetica Neue", Roboto, sans-serif; background-color: #f9fafb; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
    .btn-press { transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .btn-press:active { transform: scale(0.97); }
    .gradient-text-profit { background: linear-gradient(135deg, #10b981, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-text-loss { background: linear-gradient(135deg, #ef4444, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card-shadow-sm { box-shadow: 0 2px 8px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.04); }
    .card-shadow-md { box-shadow: 0 8px 24px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04); }
    .tab-active { border-bottom: 3px solid #7c3aed; color: #6d28d9; font-weight: 700; }
    .tab-inactive { color: #9ca3af; border-bottom: 3px solid transparent; }
    .safe-bottom { padding-bottom: var(--safe-bottom); }
    .badge { display: inline-flex; align-items: center; padding: 0.2em 0.75em; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
    .app-container { width: 100%; max-width: 720px; margin: 0 auto; }
    .desktop-shell { width: 100%; }
    .chip-inactive { background: white; border: 1px solid #e5e7eb; color: #374151; }
    .chip-active { background: linear-gradient(135deg, #7c3aed, #6366f1); color: white; border: 1px solid transparent; box-shadow: 0 2px 6px rgba(99,102,241,0.25); }
    .data-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid #f3f4f6; font-size: 0.75rem; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #9ca3af; white-space: nowrap; font-weight: 500; }
    .data-value { font-weight: 600; color: #374151; text-align: right; }
    .compact-section { padding: 0.5rem 0.75rem; }
    .compact-input { padding: 0.6rem 0.75rem; }
    .dashboard-hero { background: linear-gradient(120deg, #5b21b6 0%, #6d28d9 46%, #2563eb 100%); }
    .dashboard-page { background: radial-gradient(circle at 15% -10%, rgba(124,58,237,0.10), transparent 36%), #f8fafc; }
    .empty-state-panel { min-height: 260px; border: 1px dashed #d8dce6; background: rgba(255,255,255,0.72); }
    .risk-summary { background: linear-gradient(135deg, #f5f3ff, #eef2ff); }
    @media (min-width: 768px) {
      body { background: #eef2f7; }
      .app-container { max-width: 1280px; min-height: 100vh; margin: 0 auto; background: #f8fafc; box-shadow: 0 0 0 1px rgba(15,23,42,0.05), 0 22px 48px rgba(15,23,42,0.08); }
      .desktop-shell { max-width: 1180px; margin-left: auto; margin-right: auto; padding-left: 2rem; padding-right: 2rem; }
      .desktop-static-action { position: static !important; background: transparent !important; border: 0 !important; box-shadow: none !important; padding: 0 !important; }
      .desktop-form-main { max-width: 1180px; margin: 0 auto; padding: 2rem !important; }
      .desktop-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; align-items: start; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ---- 策略選項 ----
    const STRATEGY_OPTIONS = ["VCP", "Pocket Pivot", "BOL", "HVB", "Pull back Recovery", "Pull back Testing", "LVP", "Buyable gap-up", "Shakeout play", "Buy in support level"];

    // ---- M.E.T.S 清單 ----
    const METS_CHECKLIST = [
      { category: "大盤指數 (Market)", items: [
        { id: "m_trend", label: "大盤指數趨勢", options: [
          { text: "強勢上升", edge: "long", weight: 1 }, { text: "弱勢上升", edge: "long", weight: 1 }, { text: "盤整區間", edge: "neutral", weight: 1 }, { text: "弱勢下降", edge: "short", weight: 1 }, { text: "強勁下降", edge: "short", weight: 1 }
        ]},
        { id: "m_dist", label: "出貨日", options: [{ text: "無 / 很少", edge: "long", weight: 1 }, { text: "有顯著出貨日", edge: "short", weight: 1 }] },
        { id: "m_breadth50", label: "市寬 - 50天線以上比例", options: [{ text: ">70%", edge: "long", weight: 1 }, { text: "50-70%", edge: "neutral", weight: 1 }, { text: "<50%", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "m_breadth200", label: "市寬 - 200天線以上比例", options: [{ text: ">60%", edge: "long", weight: 1 }, { text: "40-60%", edge: "neutral", weight: 1 }, { text: "<40%", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "m_other_sell", label: "其他賣出訊號", options: [{ text: "市寬背馳", edge: "short", weight: 1 }, { text: "突兀走勢", edge: "short", weight: 1 }, { text: "急漲性走勢", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] }
      ]},
      { category: "所屬板塊 (Sector)", items: [
        { id: "e_rs", label: "板塊相對強度", options: [{ text: "★★★★★ (強)", edge: "long", weight: 1 }, { text: "★★★★☆ (中上)", edge: "long", weight: 1 }, { text: "★★★☆☆ (中等)", edge: "neutral", weight: 1 }, { text: "★★☆☆☆ (弱)", edge: "short", weight: 1 }] },
        { id: "e_trend", label: "所屬板塊趨勢", options: [{ text: "上升趨勢", edge: "long", weight: 1 }, { text: "橫行區間", edge: "long", weight: 1 }, { text: "下跌趨勢", edge: "short", weight: 1 }] },
        { id: "e_peer_rank", label: "個股相對同行排名", options: [{ text: "前 25%", edge: "long", weight: 1 }, { text: "25%-50%", edge: "neutral", weight: 1 }, { text: "後 50%", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] }
      ]},
      { category: "個股趨勢 (Trend)", items: [
        { id: "t_rs", label: "個股相對強度", options: [{ text: "高於 80", edge: "long", weight: 1 }, { text: "50 - 80", edge: "neutral", weight: 1 }, { text: "低於 50", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "t_long_trend", label: "長期趨勢 (週線)", options: [{ text: "上升趨勢", edge: "long", weight: 1 }, { text: "橫行區間", edge: "neutral", weight: 1 }, { text: "下跌趨勢", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "t_mid_trend", label: "中/短期趨勢 (日線)", options: [{ text: "上升趨勢", edge: "long", weight: 1 }, { text: "盤整", edge: "neutral", weight: 1 }, { text: "下跌趨勢", edge: "short", weight: 1 }] }
      ]},
      { category: "個股交易型態 (Structure/Vol)", items: [
        { id: "s_daily_support", label: "日線圖 - 重要支持位", dynamic: true, type: "support" },
        { id: "s_daily_resist", label: "日線圖 - 阻力位", dynamic: true, type: "resist" },
        { id: "s_weekly_support", label: "週線圖 - 支持位", dynamic: true, type: "support" },
        { id: "s_weekly_resist", label: "週線圖 - 阻力位", dynamic: true, type: "resist" },
        { id: "s_trendline", label: "趨勢線支持", dynamic: true, type: "support" },
        { id: "s_ma_support", label: "移動平均線 (10/20/50/200MA)", dynamic: true, type: "ma" },
        { id: "s_prev_resist_support", label: "前阻力變支持位", dynamic: true, type: "support" },
        { id: "s_vol_up", label: "上升時成交量", options: [{ text: "帶量上漲", edge: "long", weight: 1 }, { text: "量能一般", edge: "neutral", weight: 1 }, { text: "量能不足", edge: "short", weight: 1 }] },
        { id: "s_vol_down", label: "拉回時成交量", options: [{ text: "低量拉回", edge: "long", weight: 1 }, { text: "帶量下跌", edge: "short", weight: 1 }] },
        { id: "s_gap", label: "裂口跳空", options: [{ text: "上升裂口", edge: "long", weight: 1 }, { text: "無裂口", edge: "neutral", weight: 1 }, { text: "向下裂口", edge: "short", weight: 1 }] },
        { id: "s_shakeout", label: "洗盤 / 假突破", options: [{ text: "無洗盤", edge: "neutral", weight: 1 }, { text: "洗盤 (小量)", edge: "long", weight: 1 }, { text: "危險 (大量)", edge: "short", weight: 1 }] },
        { id: "s_pattern", label: "圖表型態", options: [{ text: "VCP", edge: "long", weight: 1 }, { text: "High tight flag", edge: "long", weight: 1 }, { text: "Cup with handle", edge: "long", weight: 1 }, { text: "Double bottom", edge: "long", weight: 1 }, { text: "Pocket pivot", edge: "long", weight: 1 }, { text: "Head & shoulder", edge: "short", weight: 1 }, { text: "Climax run", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "s_candlestick", label: "陰陽燭形態", options: [{ text: "破腳穿頭", edge: "long", weight: 1 }, { text: "錘頭", edge: "long", weight: 1 }, { text: "早晨之星", edge: "long", weight: 1 }, { text: "穿頭破腳", edge: "short", weight: 1 }, { text: "倒轉錘頭", edge: "short", weight: 1 }, { text: "黃昏之星", edge: "short", weight: 1 }, { text: "Not given", edge: "neutral", weight: 1 }] },
        { id: "s_macd", label: "MACD (權重0.5)", options: [{ text: "上升 Crossover", edge: "long", weight: 0.5 }, { text: "向下 Crossover", edge: "short", weight: 0.5 }, { text: "糾結中", edge: "neutral", weight: 0.5 }] },
        { id: "s_rsi", label: "RSI (權重0.5)", options: [{ text: ">50 強勢", edge: "long", weight: 0.5 }, { text: "30-50", edge: "neutral", weight: 0.5 }, { text: "<30 超賣", edge: "long", weight: 0.5 }] },
        { id: "s_kdj", label: "Stochastic (權重0.5)", options: [{ text: "低檔黃金交叉", edge: "long", weight: 0.5 }, { text: "高檔死亡交叉", edge: "short", weight: 0.5 }, { text: "Not given", edge: "neutral", weight: 0.5 }] }
      ]}
    ];

    // ---- 工具函數 ----
    const calculateEdges = (answers) => {
      let long = 0, short = 0;
      METS_CHECKLIST.forEach(cat => cat.items.forEach(item => {
        const ans = answers[item.id];
        if (ans && ans.edge) { const w = ans.weight || 1; if (ans.edge === 'long') long += w; if (ans.edge === 'short') short += w; }
      }));
      return { long: Math.round(long * 10) / 10, short: Math.round(short * 10) / 10 };
    };

    const formatDateShort = (ds) => { if (!ds) return '--'; const p = ds.split('-'); return p.length===3?`${p[1]}/${p[2]}`:ds; };
    const calcHoldingDays = (b, s) => { if(!b || !s) return 0; return Math.max(1, Math.floor((new Date(s+'T00:00:00') - new Date(b+'T00:00:00')) / 86400000)); };
    const calcPnL = (bp, sp) => { if(!bp || bp===0 || !sp) return 0; return ((sp-bp)/bp)*100; };
    
    const getSupportEdge = (price, buyPrice) => {
      if (!buyPrice || buyPrice <= 0 || !price) return null;
      const pct = ((buyPrice - price) / buyPrice) * 100;
      if (pct < 0) return { text: `跌破 ${pct.toFixed(1)}%`, edge: "short", pct };
      if (pct < 3) return { text: `很近 ${pct.toFixed(1)}%`, edge: "long", pct };
      if (pct <= 5) return { text: `適中 ${pct.toFixed(1)}%`, edge: "neutral", pct };
      return { text: `較遠 ${pct.toFixed(1)}%`, edge: "short", pct };
    };
    
    const getResistEdge = (price, buyPrice) => {
      if (!buyPrice || buyPrice <= 0 || !price) return null;
      const pct = ((price - buyPrice) / buyPrice) * 100;
      if (pct < 0) return { text: `已突破 ${pct.toFixed(1)}%`, edge: "short", pct };
      if (pct > 5) return { text: `較遠 ${pct.toFixed(1)}%`, edge: "long", pct };
      if (pct >= 3) return { text: `適中 ${pct.toFixed(1)}%`, edge: "neutral", pct };
      return { text: `很近 ${pct.toFixed(1)}%`, edge: "short", pct };
    };

    // ---- SVG 圖標 ----
    const Icons = {
      Plus: ({size=24}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      ArrowLeft: ({size=24}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
      ChevronDown: ({size=16}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
      ChevronUp: ({size=16}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
      ChevronRight: ({size=20}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
      TrendingUp: ({size=24}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 18 8.5 10.5 13.5 15.5 23 6"/><polyline points="17 6 23 6 23 12"/></svg>,
      Trash: ({size=16}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2 2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a2 2 0 0 1 1 1v2"/></svg>,
      EmptyFolder: ({size=40}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-gray-300"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
      BarChart: ({size=24}={})=><svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
    };

    // ---- Modal 組件 ----
    function Modal({ isOpen, onClose, title, children, actions }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-4" onClick={onClose}>
          <div className="absolute inset-0 bg-black/30 backdrop-blur-sm" />
          <div className="relative bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
            {title && <h3 className="text-lg font-extrabold text-gray-800 mb-2">{title}</h3>}
            <div className="text-xs text-gray-600 font-medium leading-relaxed">{children}</div>
            {actions && <div className="flex justify-end gap-3 mt-5">{actions}</div>}
          </div>
        </div>
      );
    }

    // ---- 主應用 ----
    function App() {
      const [trades, setTrades] = useState(() => { try { return JSON.parse(localStorage.getItem('mets_trades_v23')) || []; } catch { return []; } });
      const [view, setView] = useState('dashboard');
      const [currentTrade, setCurrentTrade] = useState(null);
      const [pendingImport, setPendingImport] = useState(null);
      const [portfolioCapital, setPortfolioCapital] = useState(() => parseFloat(localStorage.getItem('mets_portfolio_capital')) || 75000);
      const [maxExposurePercent, setMaxExposurePercent] = useState(() => parseFloat(localStorage.getItem('mets_max_exposure_percent')) || 6);
      useEffect(() => { localStorage.setItem('mets_trades_v23', JSON.stringify(trades)); }, [trades]);
      useEffect(() => { localStorage.setItem('mets_portfolio_capital', portfolioCapital.toString()); }, [portfolioCapital]);
      useEffect(() => { localStorage.setItem('mets_max_exposure_percent', maxExposurePercent.toString()); }, [maxExposurePercent]);
      
      const goTo = (v, t = null) => { setCurrentTrade(t); setView(v); window.scrollTo(0, 0); };
      
      const saveNewTrade = (data, status = 'watchlist') => {
        if (currentTrade && currentTrade.status === 'watchlist') {
          setTrades(prev => prev.map(t => t.id === currentTrade.id ? { ...t, ...data } : t));
        } else {
          const nt = { ...data, id: Date.now().toString(), status, createdAt: new Date().toISOString() };
          setTrades(prev => [nt, ...prev]);
        }
        goTo('dashboard');
      };
      
      const buyFromWatchlist = (trade, actualBuyPrice, actualShares) => {
        setTrades(prev => prev.map(t => t.id === trade.id ? { ...t, status: 'active', buyDate: new Date().toISOString().split('T')[0], actualBuyPrice: actualBuyPrice || t.targetBuyPrice, actualShares } : t));
      };
      const completeTrade = (tid, review) => {
        setTrades(prev => prev.map(t => t.id === tid ? { ...t, ...review, status: 'completed' } : t)); goTo('dashboard');
      };
      const updateActivePrice = (tid, fields) => {
        setTrades(prev => prev.map(t => t.id === tid ? { ...t, ...fields } : t));
      };
      const deleteTrade = (tid) => { setTrades(prev => prev.filter(t => t.id !== tid)); };

      const handleSelectTrade = (trade) => {
        if (trade.status === 'watchlist') { goTo('new_trade', trade); }
        else if (trade.status === 'active') { goTo('review_trade', trade); }
        else if (trade.status === 'completed') { goTo('report', trade); }
      };

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trades, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `mets_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedTrades = JSON.parse(event.target.result);
            if (Array.isArray(importedTrades)) {
              setPendingImport(importedTrades);
            } else {
              alert('匯入失敗：檔案格式不正確');
            }
          } catch (err) {
            alert('匯入失敗：無效的 JSON 檔案');
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // Reset input
      };

      return (
        <div className="app-container min-h-screen bg-gray-50 shadow-2xl relative">
          {view === 'dashboard' && <Dashboard trades={trades} onNew={() => goTo('new_trade')} onEdit={t => goTo('new_trade', t)} onCompleteEdit={t => goTo('review_trade', t)} onSelect={handleSelectTrade} onDelete={deleteTrade} onUpdatePrice={updateActivePrice} onBuy={buyFromWatchlist} onExport={handleExport} onImport={handleImport} portfolioCapital={portfolioCapital} maxExposurePercent={maxExposurePercent} onPortfolioCapitalChange={setPortfolioCapital} onMaxExposurePercentChange={setMaxExposurePercent} />}
          {view === 'new_trade' && <NewTradeForm onSave={saveNewTrade} onCancel={() => goTo('dashboard')} editTrade={currentTrade} />}
          {view === 'review_trade' && currentTrade && <ReviewTradeForm trade={currentTrade} onSave={d => completeTrade(currentTrade.id, d)} onCancel={() => goTo('dashboard')} />}
          {view === 'report' && currentTrade && <ReportView trade={currentTrade} onBack={() => goTo('dashboard')} onDelete={() => { deleteTrade(currentTrade.id); goTo('dashboard'); }} />}
          <Modal isOpen={Array.isArray(pendingImport)} onClose={() => setPendingImport(null)} title="確認匯入備份" actions={<><button onClick={() => setPendingImport(null)} className="px-4 py-2 text-xs text-gray-500 font-bold">取消</button><button onClick={() => { setTrades(pendingImport); setPendingImport(null); }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">確認取代資料</button></>}>
            此備份包含 <strong>{pendingImport?.length || 0}</strong> 筆紀錄。匯入後會完全取代目前的 <strong>{trades.length}</strong> 筆紀錄，且此操作無法復原。建議先匯出目前資料。
          </Modal>
        </div>
      );
    }

    // ---- 儀表板 ----
    function Dashboard({ trades, onNew, onEdit, onCompleteEdit, onSelect, onDelete, onUpdatePrice, onBuy, onExport, onImport, portfolioCapital, maxExposurePercent, onPortfolioCapitalChange, onMaxExposurePercentChange }) {
      const [tab, setTab] = useState('watchlist');
      const [filterStrategy, setFilterStrategy] = useState('ALL');
      const [filterCompleteOnly, setFilterCompleteOnly] = useState(false);

      const watchlist = trades.filter(t => t.status === 'watchlist');
      const active = trades.filter(t => t.status === 'active');

      const getMissingCompletionFields = (t) => {
        const missing = [];
        if (!t.sellDate) missing.push('賣出日期');
        if (t.holdingDays === undefined || t.holdingDays === null || t.holdingDays === '') missing.push('持有天數');
        if (!t.sellPrice || Number(t.sellPrice) <= 0) missing.push('賣出成交價');
        if (!t.reviewNotes || t.reviewNotes.trim().length < 10) missing.push('檢討筆記');
        return missing;
      };

      const isTradeComplete = (t) => {
        return t.strategy && t.answers?.s_pattern?.text && t.buyDate && t.actualBuyPrice && getMissingCompletionFields(t).length === 0;
      };

      const allCompleted = trades.filter(t => t.status === 'completed');
      const incompleteTrades = allCompleted.filter(t => getMissingCompletionFields(t).length > 0);
      let completed = allCompleted;
      if (filterCompleteOnly) {
        completed = completed.filter(isTradeComplete);
      }
      if (filterStrategy !== 'ALL') {
        completed = completed.filter(t => t.strategy === filterStrategy);
      }

      const availableStrategies = Array.from(new Set(trades.filter(t => t.status === 'completed').map(t => t.strategy).filter(Boolean)));

      const getSampleConfidence = (sampleSize) => {
        if (sampleSize >= 30) return { label: '樣本充足', shortLabel: '充足', tone: 'text-emerald-700 bg-emerald-50 border-emerald-200' };
        if (sampleSize >= 10) return { label: '初步可參考', shortLabel: '可參考', tone: 'text-sky-700 bg-sky-50 border-sky-200' };
        return { label: '樣本偏少', shortLabel: '偏少', tone: 'text-amber-800 bg-amber-50 border-amber-200' };
      };

      const totalComp = completed.length;
      const sampleConfidence = getSampleConfidence(totalComp);
      const winRate = totalComp > 0 ? ((completed.filter(t => t.pnlPercent > 0).length / totalComp) * 100).toFixed(1) : '--';
      const avgPnL = totalComp > 0 ? (completed.reduce((s, t) => s + (t.pnlPercent || 0), 0) / totalComp).toFixed(2) : '--';

      const getNetEdge = (t) => Math.round((((Number(t.edges?.long) || 0) - (Number(t.edges?.short) || 0)) * 10)) / 10;
      const getAttributionStats = (group) => {
        const pnlValues = group.map(t => Number(t.pnlPercent)).filter(Number.isFinite);
        const disciplineValues = group.map(t => Number(t.disciplineScore)).filter(Number.isFinite);
        const sampleSize = pnlValues.length;
        return {
          sampleSize,
          winRate: sampleSize > 0 ? (pnlValues.filter(v => v > 0).length / sampleSize) * 100 : null,
          avgPnL: sampleSize > 0 ? pnlValues.reduce((sum, value) => sum + value, 0) / sampleSize : null,
          avgDiscipline: disciplineValues.length > 0 ? disciplineValues.reduce((sum, value) => sum + value, 0) / disciplineValues.length : null
        };
      };

      const attributionTrades = completed.filter(t => Number.isFinite(Number(t.pnlPercent)));
      const highScoreStats = getAttributionStats(attributionTrades.filter(t => getNetEdge(t) >= 3));
      const lowScoreStats = getAttributionStats(attributionTrades.filter(t => getNetEdge(t) <= 0));
      const overallAttributionStats = getAttributionStats(attributionTrades);
      const conditionGroups = {};
      attributionTrades.forEach(t => {
        METS_CHECKLIST.forEach(category => category.items.forEach(item => {
          const answer = t.answers?.[item.id];
          if (!answer || !answer.text) return;
          const key = `${item.id}__${answer.text}`;
          if (!conditionGroups[key]) conditionGroups[key] = { key, itemLabel: item.label, answerText: answer.text, trades: [] };
          conditionGroups[key].trades.push(t);
        }));
      });
      const conditionAttributions = Object.values(conditionGroups)
        .map(group => {
          const stats = getAttributionStats(group.trades);
          return { ...group, ...stats, pnlDelta: stats.avgPnL === null || overallAttributionStats.avgPnL === null ? null : stats.avgPnL - overallAttributionStats.avgPnL };
        })
        .filter(group => group.sampleSize >= 3 && group.pnlDelta !== null)
        .sort((a, b) => Math.abs(b.pnlDelta) - Math.abs(a.pnlDelta))
        .slice(0, 6);

      // Holding Period & Exit Quality Analysis
      const winners = completed.filter(t => t.pnlPercent > 0);
      const losers = completed.filter(t => t.pnlPercent <= 0);
      const avgWinDays = winners.length > 0 ? (winners.reduce((s, t) => s + (t.holdingDays || 0), 0) / winners.length).toFixed(1) : '--';
      const avgLossDays = losers.length > 0 ? (losers.reduce((s, t) => s + (t.holdingDays || 0), 0) / losers.length).toFixed(1) : '--';

      const [modal, setModal] = useState({ isOpen: false, type: null, trade: null });

      const isWeekend = () => {
        const day = new Date().getDay();
        return day === 0 || day === 6; // 0 is Sunday, 6 is Saturday
      };

      const handleNewTradeClick = () => {
        if (isWeekend()) {
          setModal({ isOpen: true, type: 'weekendLock' });
          return;
        }

        // Over-trading check: 3+ losses in the last 24 hours
        const oneDayAgo = new Date(Date.now() - 86400000).toISOString();
        const recentLosses = completed.filter(t => t.pnlPercent < 0 && t.createdAt && t.createdAt >= oneDayAgo);

        if (recentLosses.length >= 3) {
          setModal({ isOpen: true, type: 'cooldown' });
        } else {
          onNew();
        }
      };

      const openDeleteModal = (t, e) => { e.stopPropagation(); setModal({ isOpen: true, type: 'delete', trade: t }); };
      const openBuyModal = (t, e) => { e.stopPropagation(); setModal({ isOpen: true, type: 'buy', trade: t }); };
      const openPriceModal = (t, e) => { e.stopPropagation(); setModal({ isOpen: true, type: 'priceUpdate', trade: t }); };
      const closeModal = () => setModal({ isOpen: false });
      const savePriceUpdate = () => {
        const currentPrice = parseFloat(document.getElementById('current-price-input')?.value);
        const highPrice = parseFloat(document.getElementById('high-price-input')?.value);
        const buyPrice = modal.trade?.actualBuyPrice || modal.trade?.targetBuyPrice;
        if (!currentPrice || currentPrice <= 0 || !highPrice || highPrice <= 0 || !buyPrice) { alert('請輸入有效的目前市價與期間最高價。'); return; }
        if (highPrice < currentPrice) { alert('期間最高價不可低於目前市價。'); return; }
        const maxProfitReached = ((highPrice - buyPrice) / buyPrice) * 100;
        onUpdatePrice(modal.trade.id, { currentPrice, highPrice, maxProfitReached });
        closeModal();
      };
      
      const calculateTotalExposure = (activeList) => {
        return activeList.reduce((total, trade) => {
          if (trade.actualBuyPrice && trade.stopLossPrice && trade.actualShares) {
            const lossPerShare = trade.actualBuyPrice - trade.stopLossPrice;
            if (lossPerShare > 0) return total + (lossPerShare * trade.actualShares);
          }
          return total;
        }, 0);
      };

      const currentExposure = calculateTotalExposure(active);
      const maxExposureAmount = portfolioCapital * (maxExposurePercent / 100);

      const handleBuyConfirm = (price, shares) => {
        if (modal.trade && price && !isNaN(parseFloat(price)) && parseFloat(price) > 0) {
          const actualShares = Math.floor(parseFloat(shares)) || modal.trade.maxShares || 0;
          if (actualShares <= 0) {
            alert('請輸入有效的實際買入股數。');
            return;
          }
          const newTradeLossPerShare = parseFloat(price) - (modal.trade.stopLossPrice || 0);
          const newTradeExposure = newTradeLossPerShare > 0 ? newTradeLossPerShare * actualShares : 0;
          const projectedExposure = currentExposure + newTradeExposure;

          if (projectedExposure > maxExposureAmount && newTradeExposure > 0) {
            const currentPct = ((currentExposure / portfolioCapital) * 100).toFixed(1);
            const projectedPct = ((projectedExposure / portfolioCapital) * 100).toFixed(1);
            setModal({ isOpen: true, type: 'exposureWarning', trade: modal.trade, projectedExposure, currentPct, projectedPct });
            return;
          }

          onBuy(modal.trade, parseFloat(price), actualShares);
        }
        closeModal();
      };

      const renderEmptyState = (message) => (
        <div className="empty-state-panel flex flex-col items-center justify-center rounded-2xl py-16 text-center animate-fade-in-up">
          <Icons.EmptyFolder size={44} />
          <p className="text-gray-400 text-xs font-bold mt-3">{message}</p>
        </div>
      );

      return (
        <div className="dashboard-page flex flex-col min-h-screen">
          <header className="dashboard-hero text-white px-5 pt-6 pb-6 rounded-b-[2.5rem] shadow-lg safe-bottom md:rounded-none md:px-0">
            <div className="desktop-shell">
              <div className="flex justify-between items-start gap-3">
              <h1 className="text-xl leading-tight font-black tracking-tight md:text-2xl">M.E.T.S. 股票交易檢討</h1>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={handleNewTradeClick} className="hidden md:inline-flex items-center gap-1.5 rounded-xl bg-white px-3 py-2 text-xs font-black text-violet-700 shadow-sm hover:bg-violet-50"><Icons.Plus size={15} /> 新增交易</button>
                <button onClick={() => setModal({ isOpen: true, type: 'exposureSettings' })} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-white/80 hover:bg-white/10 hover:text-white text-xs font-bold" title="曝險設定">風控</button>
                <button onClick={onExport} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-white/80 hover:bg-white/10 hover:text-white text-xs font-bold" title="匯出備份">匯出</button>
                <label className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-white/80 hover:bg-white/10 hover:text-white text-xs font-bold cursor-pointer" title="匯入備份">
                  匯入
                  <input type="file" accept=".json" onChange={onImport} className="hidden" />
                </label>
              </div>
            </div>
              <div className="grid grid-cols-3 gap-3 mt-5 max-w-3xl">
              <div className="bg-white/15 backdrop-blur-md rounded-2xl p-3 text-center border border-white/5"><p className="text-xl font-extrabold">{totalComp}</p><p className="text-xs text-white/80 mt-0.5">分析樣本</p></div>
              <div className="bg-white/15 backdrop-blur-md rounded-2xl p-3 text-center border border-white/5"><p className={`text-xl font-extrabold ${parseFloat(winRate) >= 50 ? 'text-emerald-300' : 'text-rose-300'}`}>{winRate}%</p><p className="text-xs text-white/80 mt-0.5">勝率</p></div>
              <div className="bg-white/15 backdrop-blur-md rounded-2xl p-3 text-center border border-white/5"><p className={`text-xl font-extrabold ${parseFloat(avgPnL) >= 0 ? 'text-emerald-300' : 'text-rose-300'}`}>{parseFloat(avgPnL) >= 0 ? '+' : ''}{avgPnL}%</p><p className="text-xs text-white/80 mt-0.5">平均盈虧</p></div>
            </div>
            {tab === 'history' && allCompleted.length > 0 && (
              <>
              <div className="mt-4 flex gap-2 overflow-x-auto hide-scrollbar">
                <button onClick={() => setModal({ isOpen: true, type: 'dataCompletion' })} className={`shrink-0 text-white text-xs font-bold px-4 py-2 rounded-xl border transition-colors flex items-center gap-1.5 ${incompleteTrades.length > 0 ? 'bg-amber-400/20 hover:bg-amber-400/30 border-amber-200/30' : 'bg-white/20 hover:bg-white/30 border-white/10'}`}><Icons.BarChart size={14} /> 資料補齊 {incompleteTrades.length > 0 ? `(${incompleteTrades.length})` : '✓'}</button>
                <button onClick={() => setModal({ isOpen: true, type: 'strategyMatrix' })} className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-1.5"><Icons.BarChart size={14} /> 策略與型態勝率</button>
                <button onClick={() => setModal({ isOpen: true, type: 'edgeCorrelation' })} className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-1.5"><Icons.BarChart size={14} /> 優勢分數與盈虧</button>
                <button onClick={() => setModal({ isOpen: true, type: 'scoreAttribution' })} className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-1.5"><Icons.BarChart size={14} /> M.E.T.S. 分數歸因</button>
                <button onClick={() => setModal({ isOpen: true, type: 'holdingAnalysis' })} className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-1.5"><Icons.BarChart size={14} /> 持有週期與出場</button>
                <button onClick={() => setModal({ isOpen: true, type: 'journalReport' })} className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-1.5"><Icons.BarChart size={14} /> 交易日誌週報</button>
              </div>
              <p className={`mt-2 inline-flex rounded-lg border px-2 py-1 text-[11px] font-bold ${sampleConfidence.tone}`}>目前分析樣本 {totalComp} 筆：{sampleConfidence.label}</p>
              </>
            )}

              {tab === 'active' && (
                <div className="mt-5 max-w-3xl bg-white/10 rounded-xl p-3 border border-white/10 animate-fade-in-up">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-bold text-white/90">總資金曝險水位</span>
                  <span className="text-xs font-bold text-white">{((currentExposure / portfolioCapital) * 100).toFixed(1)}% / {maxExposurePercent.toFixed(1)}%</span>
                </div>
                <div className="w-full bg-black/20 rounded-full h-2 overflow-hidden">
                  <div
                    className={`h-2 rounded-full transition-all duration-500 ${currentExposure / portfolioCapital > maxExposurePercent / 100 * 0.85 ? 'bg-rose-400' : currentExposure / portfolioCapital > maxExposurePercent / 100 * 0.5 ? 'bg-amber-400' : 'bg-emerald-400'}`}
                    style={{ width: `${Math.min((currentExposure / maxExposureAmount) * 100, 100)}%` }}
                  ></div>
                </div>
                </div>
              )}
            </div>
          </header>
          
          <div className="flex bg-white/95 border-b border-slate-200 px-2 sticky top-0 z-10 md:px-8 md:shadow-sm">
            {[{ key: 'watchlist', label: '📋 觀察名單', count: watchlist.length }, { key: 'active', label: '📈 持有中', count: active.length }, { key: 'history', label: '📊 歷史報告', count: completed.length }].map(t => (
              <button key={t.key} onClick={() => setTab(t.key)} className={`flex-1 min-h-[48px] py-3 text-xs font-bold text-center transition-colors ${tab === t.key ? 'tab-active' : 'tab-inactive hover:text-gray-600'}`}>{t.label} ({t.count})</button>
            ))}
          </div>
          
          <main className="desktop-shell flex-1 overflow-y-auto px-4 py-6 space-y-3 pb-24 md:pb-8">
            {tab === 'watchlist' && (watchlist.length === 0 ? renderEmptyState('暫無觀察項目，點擊下方按鈕規劃新計畫') : watchlist.map(t => (
              <div key={t.id} onClick={() => onSelect(t)} className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 animate-fade-in-up cursor-pointer hover:border-purple-200 transition-colors">
                <div className="flex justify-between items-start mb-2">
                  <div><span className="font-extrabold text-xl text-gray-800 tracking-tight">{t.ticker}</span><span className="badge bg-indigo-50 text-indigo-700 ml-2 border border-indigo-100">{t.strategy}</span></div>
                  <div className="flex gap-1">
                    <button onClick={(e) => { e.stopPropagation(); onEdit(t); }} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center text-gray-500 hover:text-indigo-600 rounded-xl hover:bg-indigo-50 text-xs font-bold transition-colors">編輯</button>
                    <button onClick={(e) => openDeleteModal(t, e)} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center text-gray-400 hover:text-rose-500 rounded-xl hover:bg-rose-50 transition-colors" aria-label={`刪除 ${t.ticker}`}><Icons.Trash size={18}/></button>
                  </div>
                </div>
                <div className="mt-3 grid grid-cols-1 md:grid-cols-3 md:gap-3">
                  <div className="data-row md:block md:rounded-xl md:bg-slate-50 md:p-3 md:border-0"><span className="data-label md:block">計劃買入價</span><span className="data-value md:block md:text-left md:mt-1 md:text-base">${t.targetBuyPrice?.toFixed(2)}</span></div>
                  <div className="data-row md:block md:rounded-xl md:bg-slate-50 md:p-3 md:border-0"><span className="data-label md:block">止損 / 目標價</span><span className="data-value md:block md:text-left md:mt-1 md:text-base">${t.stopLossPrice?.toFixed(2) || '--'} / ${t.targetPrice?.toFixed(2) || '--'}</span></div>
                  <div className="data-row md:block md:rounded-xl md:bg-slate-50 md:p-3 md:border-0"><span className="data-label md:block">風險 / 報酬比 (R/R)</span><span className="data-value md:block md:text-left md:mt-1 md:text-base">{t.riskPercent || '--'}% / {t.rewardPercent || '--'}% ({t.rrRatio || '--'})</span></div>
                </div>
                <div className="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">
                  <div className="flex gap-2">
                    <span className="badge bg-emerald-50 text-emerald-700 border border-emerald-100">L: {t.edges?.long??0}</span>
                    <span className="badge bg-rose-50 text-rose-700 border border-rose-100">S: {t.edges?.short??0}</span>
                    {t.maxShares && <span className="badge bg-indigo-50 text-indigo-700 border border-indigo-100">{t.maxShares}股</span>}
                  </div>
                  <button onClick={(e) => openBuyModal(t, e)} className="min-h-[44px] bg-indigo-600 text-white px-5 py-2 rounded-xl text-xs font-bold btn-press shadow-sm">確認買入</button>
                </div>
              </div>
            )))}
            {tab === 'active' && (active.length === 0 ? renderEmptyState('暫無持有項目') : active.map(t => (
              <div key={t.id} onClick={() => onSelect(t)} className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 flex flex-col items-stretch gap-4 animate-fade-in-up cursor-pointer hover:border-purple-200 transition-colors sm:flex-row sm:justify-between sm:items-center">
                <div className="flex-1">
                  <div className="flex items-center gap-2"><span className="font-extrabold text-xl text-gray-800 tracking-tight">{t.ticker}</span><span className="badge bg-indigo-50 text-indigo-700 border border-indigo-100">{t.strategy}</span></div>
                  <div className="text-xs text-gray-400 font-semibold mt-1">📅 {formatDateShort(t.buyDate)} 成本: <strong className="text-gray-700">${t.actualBuyPrice?.toFixed(2) || t.targetBuyPrice?.toFixed(2)}</strong>{t.actualShares ? ` · ${t.actualShares} 股` : ''}</div>
                  <div className="flex gap-1.5 mt-1.5"><span className="badge bg-emerald-50 text-emerald-700">L: {t.edges?.long??0}</span><span className="badge bg-rose-50 text-rose-700">S: {t.edges?.short??0}</span></div>

                  {/* Trail a meaningful prior profit by comparing tracked high to current price. */}
                  {t.maxProfitReached > 10 && t.currentPrice <= (t.actualBuyPrice || t.targetBuyPrice) * 1.02 && (
                    <div className="mt-3 bg-amber-50 border border-amber-200 rounded-lg p-3 flex items-start gap-2 animate-fade-in-up">
                      <span className="text-amber-500">⚠️</span>
                      <p className="text-xs text-amber-800 font-medium leading-relaxed">
                        <strong>獲利回吐警告：</strong> 部位曾獲利 {t.maxProfitReached.toFixed(1)}%，目前已回落至成本區。為避免獲利單變虧損，建議將止損價上移至成本價。
                      </p>
                    </div>
                  )}
                </div>
                <div className="grid w-full grid-cols-2 gap-2 shrink-0 sm:flex sm:w-auto sm:flex-col sm:ml-4">
                  <button onClick={(e) => openPriceModal(t, e)} className="min-h-[44px] border border-indigo-200 text-indigo-700 px-3 py-2 rounded-xl text-xs font-bold btn-press bg-white hover:bg-indigo-50">更新市價</button>
                  <button className="min-h-[44px] bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold btn-press">檢討賣出</button>
                </div>
              </div>
            )))}
            {tab === 'history' && (
              <div className="mb-4 flex flex-wrap gap-2 animate-fade-in-up">
                <select value={filterStrategy} onChange={(e) => setFilterStrategy(e.target.value)} className="bg-white border border-gray-200 text-gray-700 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                  <option value="ALL">所有策略</option>
                  {availableStrategies.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <button onClick={() => setFilterCompleteOnly(!filterCompleteOnly)} className={`min-h-[40px] px-3 py-2 rounded-xl text-xs font-bold border transition-colors ${filterCompleteOnly ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}>
                  {filterCompleteOnly ? '✓ 僅顯示完整資料' : '顯示所有資料'}
                </button>
                <button onClick={() => setModal({ isOpen: true, type: 'dataCompletion' })} className={`min-h-[40px] px-3 py-2 rounded-xl text-xs font-bold border transition-colors ${incompleteTrades.length > 0 ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`}>
                  {incompleteTrades.length > 0 ? `補齊 ${incompleteTrades.length} 筆資料` : '✓ 資料完整'}
                </button>
                <span className={`inline-flex min-h-[40px] items-center rounded-xl border px-3 py-2 text-xs font-bold ${sampleConfidence.tone}`}>樣本 {totalComp} 筆 · {sampleConfidence.label}</span>
              </div>
            )}
            {tab === 'history' && (completed.length === 0 ? renderEmptyState('暫無符合條件的歷史報告') : completed.map(t => {
              const isProfit = t.pnlPercent >= 0;
              return (
                <div key={t.id} onClick={() => onSelect(t)} className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer animate-fade-in-up hover:border-purple-200 transition-colors">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-xl text-gray-800 tracking-tight">{t.ticker}</span>
                      <span className={`badge ${isProfit ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>{isProfit ? '📈 獲利' : '📉 虧損'}</span>
                      {!isTradeComplete(t) && <span className="badge bg-amber-50 text-amber-700 border border-amber-100" title="資料不完整，可能影響分析準確度">⚠️ 缺漏</span>}
                    </div>
                    <p className="text-xs text-gray-400 font-semibold mt-1">持倉 {t.holdingDays ?? '--'}天 | {formatDateShort(t.buyDate)} ➜ {t.sellDate ? formatDateShort(t.sellDate) : '--'}</p>
                  </div>

                  const pnl = t.pnlPercent || 0;

                  // Map netEdge (-10 to +10) to x (0% to 100%)
                  const x = Math.max(0, Math.min(100, ((netEdge + 10) / 20) * 100));

                  // Map PnL (-20% to +20%) to y (100% to 0%)
                  const y = Math.max(0, Math.min(100, 100 - ((pnl + 20) / 40) * 100));

                  return (
                    <div
                      key={t.id}
                      className={`absolute w-3 h-3 rounded-full -ml-1.5 -mt-1.5 opacity-70 ${pnl >= 0 ? 'bg-emerald-500' : 'bg-rose-500'}`}
                      style={{ left: `${x}%`, top: `${y}%` }}
                      title={`${t.ticker}: 淨優勢 ${netEdge}, 盈虧 ${pnl.toFixed(1)}%`}
                    ></div>
                  );
                })}
              </div>
            </div>
          </Modal>
          <Modal isOpen={modal.isOpen && modal.type === 'delete'} onClose={closeModal} title="確認刪除項目" actions={<><button onClick={closeModal} className="px-4 py-2 text-xs text-gray-500 font-bold">取消</button><button onClick={() => { onDelete(modal.trade.id); closeModal(); }} className="px-4 py-2 bg-rose-500 text-white rounded-xl font-bold text-xs">確定刪除</button></>}>確定要將 {modal.trade?.ticker} 從清單中完全移除嗎？</Modal>
          <Modal isOpen={modal.isOpen && modal.type === 'buy'} onClose={closeModal} title={`買入紀錄：${modal.trade?.ticker}`} actions={<><button onClick={closeModal} className="px-4 py-2 text-xs text-gray-500 font-bold">取消</button><button onClick={() => { const pInput = document.getElementById('buy-price-input'); const sInput = document.getElementById('buy-shares-input'); if (pInput) handleBuyConfirm(pInput.value, sInput?.value); }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">確認交易</button></>}>
            <div className="space-y-3 pt-1">
              <p className="text-xs font-semibold text-gray-500">計畫進場價: <strong className="text-gray-800">${modal.trade?.targetBuyPrice?.toFixed(2)}</strong></p>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">實際買入成交價：</label>
                  <input id="buy-price-input" type="number" inputmode="decimal" step="0.01" defaultValue={modal.trade?.targetBuyPrice?.toFixed(2)} className="w-full p-2.5 border-2 border-indigo-100 rounded-xl text-base font-bold text-indigo-700 text-center outline-none focus:border-indigo-500" placeholder="0.00" autoFocus />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">實際買入股數：</label>
                  <input id="buy-shares-input" type="number" inputmode="numeric" defaultValue={modal.trade?.maxShares || ''} className="w-full p-2.5 border-2 border-gray-200 rounded-xl text-base font-bold text-gray-700 text-center outline-none focus:border-gray-400" placeholder="股數" />
                </div>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    // ---- 交易前檢視表單 ----
    function NewTradeForm({ onSave, onCancel, editTrade }) {
      const [ticker, setTicker] = useState(editTrade ? editTrade.ticker : '');
      const [buyDate, setBuyDate] = useState(editTrade ? editTrade.buyDate : new Date().toISOString().split('T')[0]);
      const [targetBuyPrice, setTargetBuyPrice] = useState(editTrade ? editTrade.targetBuyPrice : '');
      const [strategy, setStrategy] = useState(editTrade ? editTrade.strategy : 'LVP');
      const [answers, setAnswers] = useState(editTrade ? editTrade.answers : {});
      const [totalCapital, setTotalCapital] = useState(editTrade ? editTrade.totalCapital.toString() : '75000');
      const [stopLossPrice, setStopLossPrice] = useState(editTrade ? editTrade.stopLossPrice || '' : '');
      const [targetPrice, setTargetPrice] = useState(editTrade ? editTrade.targetPrice || '' : '');
      const [priceInputs, setPriceInputs] = useState(() => {
        const defaults = {
          s_daily_support: '', s_daily_resist: '', s_weekly_support: '', s_weekly_resist: '',
          s_trendline: '', s_prev_resist_support: '', s_ma_support: { ma10: '', ma20: '', ma50: '', ma200: '' }
        };
        const saved = editTrade?.priceInputs || {};
        return { ...defaults, ...saved, s_ma_support: { ...defaults.s_ma_support, ...(saved.s_ma_support || {}) } };
      });
      const [accordionOpen, setAccordionOpen] = useState(false);
      const [modal, setModal] = useState({ isOpen: false, message: '' });
      const [riskWarning, setRiskWarning] = useState({ isOpen: false, warnings: [], pendingStatus: null });

      const buyP = parseFloat(targetBuyPrice);
      const isUSStock = /^[A-Za-z.]+$/.test(ticker.trim());
      const capitalHKD = parseFloat(totalCapital) || 0;
      const effectiveCapital = isUSStock ? capitalHKD / 7.8 : capitalHKD;

      useEffect(() => {
        if (!buyP || buyP <= 0) return;
        const newDynamicAnswers = {};
        METS_CHECKLIST.flatMap(cat => cat.items).filter(item => item.dynamic).forEach(item => {
          if (item.id === 's_ma_support') {
            const maValues = priceInputs.s_ma_support;
            const edges = []; let longCount = 0, shortCount = 0;
            Object.entries(maValues).forEach(([key, val]) => {
              const price = parseFloat(val);
              if (!isNaN(price) && price > 0) {
                const edge = price <= buyP ? getSupportEdge(price, buyP) : getResistEdge(price, buyP);
                if (edge) { edges.push({ key, price, ...edge }); if (edge.edge === 'long') longCount++; else if (edge.edge === 'short') shortCount++; }
              }
            });
            newDynamicAnswers[item.id] = edges.length === 0 ? null : { edge: longCount >= shortCount ? 'long' : 'short', weight: 1, details: edges, text: `移動平均線支持` };
          } else {
            const price = parseFloat(priceInputs[item.id]);
            if (isNaN(price) || price <= 0) { newDynamicAnswers[item.id] = null; return; }
            const edgeObj = item.type === 'support' ? getSupportEdge(price, buyP) : getResistEdge(price, buyP);
            if (edgeObj) newDynamicAnswers[item.id] = { ...edgeObj, weight: 1 };
          }
        });
        setAnswers(prev => ({ ...prev, ...newDynamicAnswers }));
      }, [priceInputs, buyP]);

      const currentEdges = useMemo(() => calculateEdges(answers), [answers]);
      
      const handleOptionSelect = (itemId, option) => {
        if (answers[itemId]?.text === option.text) {
          const newAns = { ...answers }; delete newAns[itemId]; setAnswers(newAns);
        } else {
          setAnswers(prev => ({ ...prev, [itemId]: option }));
        }
      };
      
      const handlePriceChange = (itemId, value, maKey = null) => {
        setPriceInputs(prev => {
          const ns = { ...prev };
          if (maKey) ns.s_ma_support = { ...ns.s_ma_support, [maKey]: value };
          else ns[itemId] = value;
          return ns;
        });
      };

      const riskPercent = buyP && stopLossPrice ? Math.abs(((buyP - parseFloat(stopLossPrice)) / buyP) * 100).toFixed(2) : '--';
      const rewardPercent = buyP && targetPrice ? Math.abs(((parseFloat(targetPrice) - buyP) / buyP) * 100).toFixed(2) : '--';
      const rrRatio = riskPercent !== '--' && rewardPercent !== '--' && parseFloat(riskPercent) > 0 ? (parseFloat(rewardPercent) / parseFloat(riskPercent)).toFixed(2) : '--';
      let maxShares = null, maxAmount = null;
      if (buyP && stopLossPrice && effectiveCapital > 0 && parseFloat(stopLossPrice) < buyP) {
        const lossPerShare = buyP - parseFloat(stopLossPrice);
        maxShares = Math.floor(effectiveCapital * 0.005 / lossPerShare);
        maxAmount = maxShares * buyP;
      }

      const forceSave = (status) => {
        onSave({
          ticker: ticker.trim().toUpperCase(), buyDate, targetBuyPrice: buyP, strategy,
          answers, edges: currentEdges, priceInputs,
          totalCapital: capitalHKD, stopLossPrice: parseFloat(stopLossPrice) || 0, targetPrice: parseFloat(targetPrice) || 0,
          isUSStock, effectiveCapital, maxShares, maxAmount, rrRatio, riskPercent, rewardPercent
        }, status);
      };

      const handleSave = (status = 'watchlist') => {
        if (!ticker.trim() || !buyP || buyP <= 0) {
          setModal({ isOpen: true, message: '請務必填寫股票代號，以及合理的預計進場價格。' });
          return;
        }

        const warnings = [];
        if (!stopLossPrice || !targetPrice) warnings.push('未設定完整的止損或止盈價，缺乏出場計畫。');
        if (rrRatio !== '--' && parseFloat(rrRatio) < 2.0) warnings.push(`風報比 (${rrRatio}) 低於建議的 2.0，長期期望值偏低。`);
        if (riskPercent !== '--' && parseFloat(riskPercent) > 8.0) warnings.push(`止損幅度 (${riskPercent}%) 過大，單筆風險過高。`);
        if (currentEdges.short > currentEdges.long) warnings.push(`系統評分顯示技術劣勢 (S:${currentEdges.short}) 多於優勢 (L:${currentEdges.long})。`);

        if (warnings.length > 0) {
          setRiskWarning({ isOpen: true, warnings, pendingStatus: status });
        } else {
          forceSave(status);
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50">
          <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">

              <button onClick={onCancel} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center -ml-2 text-gray-500 rounded-full hover:bg-gray-100" aria-label="返回"><Icons.ArrowLeft size={22} /></button>
              <div className="flex-1 text-center">
                <p className="hidden md:block text-xs font-black uppercase tracking-[0.18em] text-indigo-500">Trade plan</p>
                <h1 className="text-base font-extrabold tracking-tight text-gray-800">{editTrade ? `修改 ${editTrade.ticker} 交易計畫` : '建立 M.E.T.S 交易計畫'}</h1>
              </div>
              <span className="w-6"></span>
            </div>
          </header>
          
          <main className="desktop-form-main flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-44">
            <div className="bg-white p-4 md:p-6 rounded-3xl border border-slate-200 card-shadow-md space-y-5">
              <div className="flex items-start justify-between gap-4">
                <div><p className="text-xs font-black uppercase tracking-[0.14em] text-indigo-600">01 · 交易基本資料</p><p className="mt-1 text-sm text-slate-500">先定義標的、入場價格與執行策略。</p></div>
                <span className="hidden md:inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-500">盤前檢查</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div><label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">股票代號</label><input type="text" value={ticker} onChange={e => setTicker(e.target.value.toUpperCase())} className="w-full p-3 border border-slate-200 rounded-xl text-lg font-black tracking-tight uppercase focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none" placeholder="AAPL" /></div>
                <div><label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">計畫日期</label><input type="date" value={buyDate} onChange={e => setBuyDate(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl text-sm font-bold text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none" /></div>
                <div><label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">計畫買入價</label><input type="number" inputmode="decimal" step="0.01" value={targetBuyPrice} onChange={e => setTargetBuyPrice(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl text-base font-extrabold text-indigo-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none" placeholder="0.00" /></div>
                <div><label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">採用策略</label><select value={strategy} onChange={e => setStrategy(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl bg-white text-sm font-bold text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none">{STRATEGY_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
              </div>
              
              <div className="risk-summary border border-indigo-100 rounded-2xl overflow-hidden">
                <button onClick={() => setAccordionOpen(!accordionOpen)} className="w-full grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3 p-4 text-left font-extrabold text-sm text-slate-700 hover:bg-white/60">
                  <span className="min-w-0"><span className="block">💰 資金控管與風報比試算</span>{isUSStock && <span className="mt-0.5 block text-xs text-indigo-600 font-bold">可用資金約為美元 ${effectiveCapital.toFixed(0)}</span>}</span>
                  <span className="flex h-8 w-8 items-center justify-center rounded-full bg-white text-indigo-600 shadow-sm">{accordionOpen ? <Icons.ChevronUp size={16} /> : <Icons.ChevronDown size={16} />}</span>
                </button>
                {accordionOpen && (
                  <div className="grid gap-4 border-t border-indigo-100 bg-white p-4 animate-fade-in-up md:grid-cols-[minmax(0,1.1fr)_minmax(280px,0.9fr)]">
                    <div className="space-y-3">
                      <div><label className="text-xs font-bold text-gray-400 uppercase block mb-1.5">總投資金額 (HKD)</label><input type="number" inputmode="decimal" value={totalCapital} onChange={e => setTotalCapital(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-indigo-500" /></div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label className="text-xs font-bold text-gray-400 uppercase block mb-1.5">設定止損價</label><input type="number" inputmode="decimal" step="0.01" value={stopLossPrice} onChange={e => setStopLossPrice(e.target.value)} className="w-full p-3 border border-rose-100 rounded-xl text-sm font-bold text-rose-500 outline-none focus:border-rose-400" placeholder="0.00" /></div>
                        <div><label className="text-xs font-bold text-gray-400 uppercase block mb-1.5">目標止盈價</label><input type="number" inputmode="decimal" step="0.01" value={targetPrice} onChange={e => setTargetPrice(e.target.value)} className="w-full p-3 border border-emerald-100 rounded-xl text-sm font-bold text-emerald-500 outline-none focus:border-emerald-400" placeholder="0.00" /></div>
                      </div>
                    </div>
                    <div className="rounded-2xl bg-slate-50 p-4 flex flex-col justify-between gap-4">
                      <div className="grid grid-cols-2 gap-3 text-xs"><div><p className="text-slate-400 font-bold">單筆風險</p><p className="mt-1 text-lg font-black text-rose-500">{riskPercent}%</p></div><div><p className="text-slate-400 font-bold">預估利潤</p><p className="mt-1 text-lg font-black text-emerald-500">{rewardPercent}%</p></div></div>
                      <div className="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-3 py-2"><span className="text-xs font-bold text-slate-500">風報比 R/R</span><strong className="text-xl text-indigo-600">{rrRatio}</strong></div>
                      {maxShares !== null && <div className="rounded-xl bg-indigo-600 px-3 py-2.5 text-center text-xs font-bold leading-normal text-white shadow-md shadow-indigo-100">建議買入 <strong className="mx-1 text-sm underline">{maxShares}</strong> 股 · 約 ${maxAmount.toFixed(2)}</div>}
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {METS_CHECKLIST.map((cat, idx) => (
                <div key={idx} className={`bg-white rounded-3xl p-4 md:p-5 card-shadow-sm border border-slate-200 space-y-3 ${idx === 3 ? 'md:col-span-2' : ''}`}>
                  <h3 className="font-extrabold text-xs text-gray-400 uppercase tracking-widest border-b border-gray-50 pb-2 flex items-center gap-1.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${idx===0?'bg-blue-500':idx===1?'bg-purple-500':idx===2?'bg-emerald-500':'bg-amber-500'}`}></span>
                    {cat.category}
                  </h3>
                  <div className="space-y-3.5">
                    {cat.items.map(item => {
                      if (item.dynamic) {
                        if (item.id === 's_ma_support') {
                          const answer = answers[item.id];
                          return (
                            <div key={item.id} className="space-y-2 pt-1 border-t border-gray-50/50 first:border-0 first:pt-0">
                              <p className="text-xs font-bold text-gray-700">{item.label}</p>
                              <div className="grid grid-cols-2 gap-2">
                                {Object.entries(priceInputs.s_ma_support).map(([key, val]) => {
                                  const detail = answer?.details?.find(d => d.key === key);
                                  return (
                                    <div key={key} className="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100">
                                      <span className="text-xs font-black text-gray-400 uppercase w-10">{key.replace('ma','MA ')}</span>
                                      <input type="number" inputmode="decimal" step="0.01" value={val} onChange={e => handlePriceChange(item.id, e.target.value, key)} className="flex-1 min-w-0 p-2 text-sm border rounded bg-white text-center font-bold text-gray-800" placeholder="0.0" />
                                      {detail && <span className={`px-1.5 py-1 rounded text-xs font-black w-12 text-center ${detail.edge==='long'?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`}>{detail.edge==='long'?'L':'S'}</span>}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        }
                        const answer = answers[item.id];
                        return (
                          <div key={item.id} className="flex flex-col gap-1.5 pt-2 border-t border-gray-50/50 first:border-0 first:pt-0">
                            <span className="text-xs font-bold text-gray-700">{item.label}</span>
                            <div className="flex items-center gap-2">
                              <input type="number" inputmode="decimal" step="0.01" value={priceInputs[item.id] || ''} onChange={e => handlePriceChange(item.id, e.target.value)} className="w-full p-2.5 text-sm border rounded-xl font-bold text-gray-800" placeholder="輸入價格" />
                              {answer && <span className={`px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${answer.edge==='long'?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`}>{answer.edge==='long'?'📈':'📉'} {answer.text}</span>}
                            </div>
                          </div>
                        );
                      }
                      
                      const selected = answers[item.id];
                      return (
                        <div key={item.id} className="space-y-1.5 pt-2 border-t border-gray-50/50 first:border-0 first:pt-0">
                          <p className="text-xs font-bold text-gray-700">{item.label}</p>
                          <div className="flex flex-wrap gap-1.5">
                            {item.options.map((opt, oIdx) => {
                              const isSel = selected?.text === opt.text;
                              return (
                                <button key={oIdx} onClick={() => handleOptionSelect(item.id, opt)} className={`min-h-[44px] px-3.5 py-2 rounded-xl text-sm font-bold leading-tight transition-all btn-press ${isSel ? 'chip-active' : 'chip-inactive'}`}>{opt.text}</button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </main>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-3.5 pb-[calc(1rem+env(safe-area-inset-bottom,16px))] shadow-[0_-8px_24px_rgba(0,0,0,0.04)] z-20 md:static md:bg-transparent md:border-0 md:shadow-none md:px-8 md:pb-8 md:pt-0">
            <div className="desktop-shell relative md:flex md:items-center md:justify-between md:rounded-2xl md:border md:border-slate-200 md:bg-white md:p-4 md:shadow-sm">
              <div className="flex justify-between items-center mb-2 px-1 md:mb-0 md:px-0">
                <span className="text-xs font-black text-gray-400 tracking-wider uppercase">加權優劣勢評估</span>
                <div className="flex gap-2">
                  <span className="badge bg-emerald-50 text-emerald-700 border border-emerald-100">Long: {currentEdges.long}</span>
                  <span className="badge bg-rose-50 text-rose-700 border border-rose-100">Short: {currentEdges.short}</span>
                </div>
              </div>
              <button onClick={() => handleSave('watchlist')} className="w-full bg-slate-950 hover:bg-slate-900 text-white rounded-2xl py-3.5 font-bold text-sm shadow-md btn-press md:w-auto md:min-w-[290px] md:px-8">
                {editTrade ? '儲存修改' : '儲存至我的觀察名單'}
              </button>
            </div>
          </div>
          <Modal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false })} title="提示" actions={<button onClick={() => setModal({ isOpen: false })} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">好</button>}>{modal.message}</Modal>
          <Modal isOpen={riskWarning.isOpen} onClose={() => setRiskWarning({ isOpen: false, warnings: [], pendingStatus: null })} title="⚠️ 高風險交易警告" actions={<><button onClick={() => { forceSave(riskWarning.pendingStatus); setRiskWarning({ isOpen: false, warnings: [], pendingStatus: null }); }} className="px-4 py-2 text-xs text-gray-400 font-medium underline">了解風險，強制儲存</button><button onClick={() => setRiskWarning({ isOpen: false, warnings: [], pendingStatus: null })} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">返回修改計畫</button></>}>
            <div className="space-y-2">
              <p className="text-rose-600 font-bold mb-2">系統偵測到此交易計畫違反了您的交易紀律：</p>
              <ul className="space-y-1.5 text-gray-700">
                {riskWarning.warnings.map((w, i) => <li key={i} className="flex gap-1.5"><span className="text-rose-500">🔴</span> {w}</li>)}
              </ul>
            </div>
          </Modal>
        </div>
      );
    }

    // ---- 交易後檢討 ----
    function ReviewTradeForm({ trade, onSave, onCancel }) {
      const [actualBuyPrice, setActualBuyPrice] = useState(trade.actualBuyPrice || trade.targetBuyPrice || '');
      const [sellDate, setSellDate] = useState(trade.sellDate || new Date().toISOString().split('T')[0]);
      const [sellPrice, setSellPrice] = useState(trade.sellPrice ?? '');
      const [reviewNotes, setReviewNotes] = useState(trade.reviewNotes || '');
      const [modal, setModal] = useState({ isOpen: false, message: '' });

      const handleSave = () => {
        const bp = parseFloat(actualBuyPrice);
        const sp = parseFloat(sellPrice);
        if (isNaN(bp) || bp <= 0) { setModal({ isOpen: true, message: '請輸入有效的實際買入價格。' }); return; }
        if (isNaN(sp) || sp <= 0) { setModal({ isOpen: true, message: '請輸入有效的實際賣出價格。' }); return; }
        if (reviewNotes.trim().length < 10) { setModal({ isOpen: true, message: `請至少輸入 10 個字的交易檢討筆記，目前字數：${reviewNotes.trim().length}` }); return; }
        const holdingDays = calcHoldingDays(trade.buyDate, sellDate);
        const pnlPercent = calcPnL(bp, sp);

        let disciplineScore = 5;
        let disciplineReason = '完全遵守計畫';
        const plannedStop = parseFloat(trade.stopLossPrice);
        let isSevereLoss = false;

        if (plannedStop > 0) {
          if (sp < plannedStop) {
            const slippage = ((plannedStop - sp) / plannedStop) * 100;
            if (slippage > 2) {
              disciplineScore = 2;
              disciplineReason = `嚴重凹單：賣出價低於止損價 ${slippage.toFixed(1)}%`;
              isSevereLoss = true;
            } else {
              disciplineScore = 4;
              disciplineReason = '略有滑價但有執行停損';
            }
          } else if (sp === plannedStop) {
            disciplineScore = 5;
            disciplineReason = '精準執行停損';
          }
        }

        if (isSevereLoss && reviewNotes.trim().length < 50) {
          setModal({ isOpen: true, message: `這筆交易發生了嚴重的凹單（滑價大於 2%）。為了防範情緒化交易，請在「交易檢討及學習筆記」中輸入至少 50 個字的反思，目前字數：${reviewNotes.trim().length}` });
          return;
        }

        onSave({ actualBuyPrice: bp, sellDate, sellPrice: sp, reviewNotes, holdingDays, pnlPercent, disciplineScore, disciplineReason });
      };

      return (
        <div className="flex flex-col min-h-screen bg-white">
          <header className="flex items-center px-3 py-2.5 border-b bg-white sticky top-0 z-10">
            <button onClick={onCancel} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center -ml-2 text-gray-500 rounded-full hover:bg-gray-100" aria-label="返回"><Icons.ArrowLeft size={22} /></button>
            <h1 className="text-base font-extrabold flex-1 text-center pr-8 text-gray-800">{trade.status === 'completed' ? '補齊交易資料' : '完成交易與檢討'} ({trade.ticker})</h1>
          </header>
          <main className="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-40">
            <div className="bg-slate-50 p-4 rounded-3xl border border-gray-100 flex justify-between items-center animate-fade-in-up">
              <div><p className="text-xs font-black text-gray-400 uppercase tracking-wide">交易計畫</p><p className="font-extrabold text-xl text-gray-800 mt-0.5">{trade.ticker}</p><p className="text-xs text-gray-500 mt-1">策略: {trade.strategy}</p></div>
              <div className="text-right"><p className="text-xs font-black text-gray-400 uppercase tracking-wide">計畫買入日</p><p className="font-extrabold text-sm text-gray-700 mt-0.5">{formatDateShort(trade.buyDate)}</p></div>
            </div>
            <div className="space-y-4 pt-2">
              <div><label className="text-xs font-bold text-gray-600 mb-1.5 block">實際成交買入價 (可根據手續費或實際價格微調)</label><input type="number" inputmode="decimal" step="0.01" value={actualBuyPrice} onChange={e => setActualBuyPrice(e.target.value)} className="w-full p-3 border rounded-xl text-sm font-bold bg-slate-50" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-xs font-bold text-gray-600 mb-1.5 block">賣出日期</label><input type="date" value={sellDate} onChange={e => setSellDate(e.target.value)} className="w-full p-3 border rounded-xl text-xs font-bold text-gray-600" /></div>
                <div><label className="text-xs font-bold text-gray-600 mb-1.5 block">賣出成交價</label><input type="number" inputmode="decimal" step="0.01" value={sellPrice} onChange={e => setSellPrice(e.target.value)} className="w-full p-3 border-2 border-indigo-200 rounded-xl text-sm font-extrabold text-indigo-700 focus:border-indigo-500 bg-indigo-50/20" placeholder="0.00" /></div>
              </div>
              <div><label className="text-xs font-bold text-gray-600 mb-1.5 block">交易檢討及學習筆記 (Lessons Learned)</label><textarea rows="5" value={reviewNotes} onChange={e => setReviewNotes(e.target.value)} className="w-full p-3 border rounded-xl text-xs font-medium leading-relaxed" placeholder="例如：我的買入判斷與紀律遵守如何？停利是否果斷？有哪些需要改進的地方？" /></div>
            </div>
          </main>
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-3.5 pb-[calc(1rem+env(safe-area-inset-bottom,16px))] shadow-[0_-8px_24px_rgba(0,0,0,0.04)] z-20">
            <div className="app-container relative">
              <button onClick={handleSave} className="w-full bg-gradient-to-r from-purple-700 to-indigo-600 text-white rounded-2xl py-3.5 font-bold text-sm shadow-md btn-press">{trade.status === 'completed' ? '儲存補齊資料' : '確認完成檢討報告'}</button>
            </div>
          </div>
          <Modal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false })} title="提示" actions={<button onClick={() => setModal({ isOpen: false })} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">好</button>}>{modal.message}</Modal>

        </div>
      );
    }

    // ---- 檢討報告 ----
    function ReportView({ trade, onBack, onDelete }) {
      const isProfit = trade.pnlPercent >= 0;
      return (
        <div className="flex flex-col min-h-screen bg-slate-50">
          <header className="flex items-center justify-between px-3 py-2.5 border-b bg-white sticky top-0 z-10">
            <button onClick={onBack} className="inline-flex min-h-[44px] min-w-[44px] items-center justify-center -ml-2 text-gray-500 rounded-full hover:bg-gray-100" aria-label="返回"><Icons.ArrowLeft size={22} /></button>
            <h1 className="text-base font-extrabold text-gray-800">交易檢討報告 ({trade.ticker})</h1>
            <button onClick={onDelete} className="p-1.5 -mr-1.5 text-gray-300 hover:text-rose-500 transition-colors"><Icons.Trash size={16} /></button>
          </header>
          <main className="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-20">
            <div className={`p-5 rounded-3xl text-white shadow-xl animate-fade-in-up ${isProfit ? 'bg-gradient-to-br from-emerald-500 to-teal-600' : 'bg-gradient-to-br from-rose-500 to-red-600'}`}>
              <div className="flex justify-between items-start mb-4">
                <div><span className="text-xs font-black uppercase tracking-widest opacity-80">交易結果</span><h2 className="text-3xl font-black tracking-tight">{trade.ticker}</h2><span className="badge bg-white/20 text-white mt-1 border border-white/10 text-xs font-bold">{trade.strategy}</span></div>
                <div className="text-right"><span className="text-xs font-black uppercase tracking-widest opacity-80">回報比率</span><p className="text-3xl font-black tracking-tight mt-0.5">{isProfit ? '+' : ''}{trade.pnlPercent?.toFixed(2)}%</p></div>
              </div>
              <div className="grid grid-cols-3 gap-2 border-t border-white/20 pt-3.5 mt-2 text-center text-xs">
                <div><p className="opacity-70 text-xs font-bold uppercase mb-0.5">平均買價</p><p className="font-extrabold text-base">${trade.actualBuyPrice?.toFixed(2)}</p></div>
                <div className="border-l border-r border-white/10"><p className="opacity-70 text-xs font-bold uppercase mb-0.5">賣出價格</p><p className="font-extrabold text-base">${trade.sellPrice?.toFixed(2)}</p></div>
                <div><p className="opacity-70 text-xs font-bold uppercase mb-0.5">持倉天數</p><p className="font-extrabold text-base">{trade.holdingDays} 天</p></div>
              </div>
            </div>
            {trade.disciplineScore !== undefined && (
              <div className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 space-y-2 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <h3 className="font-extrabold text-xs text-gray-400 uppercase tracking-wider">🎯 紀律遵守度</h3>
                  <div className="flex gap-0.5 text-amber-400 text-sm">
                    {Array.from({ length: 5 }).map((_, i) => (
                      <span key={i} className={i < trade.disciplineScore ? 'opacity-100' : 'opacity-20 grayscale'}>⭐</span>
                    ))}
                  </div>
                </div>
                <p className={`text-xs font-bold ${trade.disciplineScore < 3 ? 'text-rose-600' : 'text-emerald-600'}`}>{trade.disciplineReason}</p>
              </div>
            )}
            <div className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 space-y-2 animate-fade-in-up">
              <h3 className="font-extrabold text-xs text-gray-400 uppercase tracking-wider">💡 學習筆記 (Lessons Learned)</h3>
              <p className="text-xs text-gray-700 leading-relaxed font-semibold whitespace-pre-wrap bg-gray-50/50 p-3 rounded-xl border border-gray-100">{trade.reviewNotes || '無任何心得筆記。'}</p>
            </div>
            <div className="bg-white rounded-2xl p-4 card-shadow-sm border border-gray-100 space-y-3 animate-fade-in-up">
              <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 className="font-extrabold text-xs text-gray-400 uppercase tracking-wider">📊 當時 M.E.T.S. 評分依據</h3>
                <div className="flex gap-1.5"><span className="badge bg-emerald-50 text-emerald-700 border border-emerald-100">L: {trade.edges?.long}</span><span className="badge bg-rose-50 text-rose-700 border border-rose-100">S: {trade.edges?.short}</span></div>
              </div>
              <div className="space-y-1">
                {Object.entries(trade.answers).map(([key, option]) => {
                  if (!option) return null;
                  let label = key;
                  METS_CHECKLIST.forEach(cat => cat.items.forEach(i => { if (i.id === key) label = i.label; }));
                  const edge = option.edge;
                  const edgeStyle = edge === 'long' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : edge === 'short' ? 'bg-rose-50 text-rose-700 border-rose-100' : 'bg-gray-50 text-gray-600 border-gray-100';
                  return (
                    <div key={key} className="data-row">
                      <span className="data-label text-gray-500 font-semibold">{label}</span>
                      <span className={`badge border text-xs py-0.5 ${edgeStyle}`}>{option.text}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
